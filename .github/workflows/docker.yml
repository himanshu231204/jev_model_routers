name: Publish Docker image

# Runs on the same v* tags as .github/workflows/publish.yml (see RELEASE.md). Builds the image
# from this commit's source (not from the PyPI package) and pushes it to GHCR.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="ghcr.io/${{ github.repository }}:${version}"
          # Pre-releases (0.2.0rc1, 0.2.0b1, ...) don't move the "latest" tag.
          case "${version}" in
            *a*|*b*|*rc*|*dev*) ;;
            *) tags="${tags},ghcr.io/${{ github.repository }}:latest" ;;
          esac
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
