name: Publish to PyPI

# Runs when a version tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# See RELEASE.md for the full release process.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('src/jev_router_live/version.py')['__version__'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the package version ${version} (src/jev_router_live/version.py)"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section"
            exit 1
          fi

      - name: Run tests
        run: |
          pip install -e ".[test]"
          python -m pytest -q

      - name: Build and check the distributions
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): PyPI's publisher for jev-model-router trusts this repository's
    # publish.yml, so no API token is stored anywhere.
    environment:
      name: pypi
      url: https://pypi.org/p/jev-model-router
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The notes are this version's section of CHANGELOG.md, up to the next "## [" heading
          # or the link definitions at the end of the file.
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\n**Install:** `pip install jev-model-router==%s`\n' "${version}" >> notes.md

          prerelease=""
          case "${version}" in *a*|*b*|*rc*|*dev*) prerelease="--prerelease" ;; esac

          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            ${prerelease}
