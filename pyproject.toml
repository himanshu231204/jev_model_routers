[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-router"
version = "0.1.0"
description = "Per-turn JEV model routing for Claude Code and OpenAI Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]
typesafe = ["typesafe-sdk"]

[project.scripts]
jev-claude = "jev_router_live.bin.jev_claude:main"
jev-codex = "jev_router_live.bin.jev_codex:main"
jev-explain = "jev_router_live.bin.jev_explain:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
